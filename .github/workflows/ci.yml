name: Verify application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify geometry, persistence and release guards
        run: npm test
      - name: Verify native offline editor
        run: npm run test:ui
      - name: Build and verify static browser editor
        run: |
          npm run build:web
          npm run test:web
      - name: Package without hosted-runner desktop integration
        run: npm run package --ignore-scripts
      - name: Verify packaged application
        run: npm run test:packaged
